name: Decorator regression evidence
on:
  push:
    paths:
      - .github/workflows/decorator-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: d6f6a6bee7538ed2978d1a4807fe3b68a4ef452a
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Confirm regression fails on original implementation
        shell: bash
        run: |
          trap 'git restore aiocache/decorators.py' EXIT
          git restore --source=HEAD^ aiocache/decorators.py
          set +e
          python -m pytest tests/ut/test_decorators.py --no-cov -k keeps_original_arguments_on_partial_hit --junitxml=before.xml > before.log 2>&1
          result=$?
          set -e
          cat before.log
          test "$result" -eq 1
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('before.xml').iter('testcase'))
          assert len(cases) == 2
          assert sum(c.find('failure') is not None for c in cases) == 1
          assert not any(c.find('error') is not None or c.find('skipped') is not None for c in cases)
          assert any(c.get('name', '').endswith('[True]') and c.find('failure') is not None for c in cases)
          PYCODE
      - name: Verify fixed decorator suite
        run: python -m pytest tests/ut/test_decorators.py --no-cov --junitxml=after.xml -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decorator-regression-${{ matrix.python }}
          path: |
            before.log
            before.xml
            after.xml

